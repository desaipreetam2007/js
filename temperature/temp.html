<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temperature Converter</title>
    <link rel="stylesheet" href="temp.css">
</head>
<body>
    <form>
        <h1>Temperature conversion:</h1>
       <div><input type="number" value="0" id="textbox">
        <span id="yavda">Hi</span></div>
        <input type="radio" name ="unit" id="ctof">
        <label for="ctof">Celsius➡️Fahrenheit</label><br>
         <input type="radio" name ="unit" id="ftoc">
        <label for="ftoc">Fahrenheit➡️Celsius</label><br>
        <input type="radio" name ="unit" id="ctok">
        <label for="ctok">Celsius➡️Kelvin</label><br>
        <input type="radio" name ="unit" id="ktoc">
        <label for="ktoc">Kelvin➡️Celsius</label><br>
        

        <button type="submit" onclick="convert()">Submit</button>
        <p id="result"></p>
    </form>
    <script src="temp.js"></script>
</body>
</html>
